server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端静态文件（Vite SPA 回退）
    location / {
        try_files $uri /index.html;
    }

    # API 反向代理到 Flask 后端
    location /api/ {
        proxy_pass http://backend:5099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 上传的图片
    location /uploads/ {
        proxy_pass http://backend:5099/uploads/;
    }
}
